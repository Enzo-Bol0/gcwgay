<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StepStyle | Fale Conosco</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Cabeçalho -->
    <header>
        <div class="logo"><span>S</span> StepStyle</div>
        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="produtos.html">Produtos</a></li>
                <li><a href="contato.html" class="active">Contato</a></li>
            </ul>
        </nav>
    </header>

    <!-- Seção Exclusiva de Contato -->
    <section id="contato" class="section-page">
        <div class="contact-form">
            <h2>Entre em Contato</h2>
            <p>Precisa de suporte ou tem alguma dúvida sobre os produtos? Envie sua mensagem abaixo.</p>
            <form action="#" method="POST">
                <div class="form-group">
                    <input type="text" name="nome" placeholder="Seu Nome Completo" required>
                </div>
                <div class="form-group">
                    <input type="email" name="email" placeholder="Seu E-mail" required>
                </div>
                <div class="form-group">
                    <input type="text" name="assunto" placeholder="Assunto da Mensagem" required>
                </div>
                <div class="form-group">
                    <textarea name="mensagem" placeholder="Como podemos ajudar você?" required></textarea>
                </div>
                <button type="submit" class="btn" style="width: 100%; justify-content: center;">Enviar Mensagem</button>
            </form>
        </div>

        <div class="contact-image">
            <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=600&q=80" alt="Tênis Destaque Contato">
        </div>
    </section>

    <!-- Rodapé -->
    <footer>
        <p>&copy; 2026 StepStyle Inc. Todos os direitos reservados.</p>
    </footer>

</body>
</html>
